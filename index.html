30분","d":"거위 마을에 발생한 살인 사건! 다행히 목격자가 있지만 거위는 말을 하지 못한다...!! 정체를 숨긴 채, 진실을 은폐하려는 악당 거위의 방해를 피해 거위들은 사건의 진실을 밝힐 수 있을까요?!","i":"2c681083-951b-4454-ad4e-a84ccf10198e.png","a":"AAABAAAAAAA="},{"n":"탐정이 너무 많다","t":"보드게임","c":"추리","v":0,"l":"초급","p":"3 ~ 5인","m":"15분","d":"저택의 주인이 시체로 발견됐다. 폭설로 저택에 고립된 참가자들은 저마다 알리바이를 들며 결백을 주장하는데... 하지만 범인은 언제나 범행 장소에 흔적을 남기는 법. 증명되지 않은 알리바이는 과연 누구의 손에 있을까요??","i":"f1bd3615-a12f-4ffd-9b39-31bb582a0713.png","a":"AAADAAAAAAA="},{"n":"스틱업","t":"보드게임","c":"순발력","v":0,"l":"초급","p":"2 ~ 5인","m":"15분","d":"0.1초의 망설임도 허용하지 않는 극강의 순발력 게임! 방심하는 순간 상대방에게 기회를 빼앗기는 치열한 속도전 속에서, 최고의 피지컬과 순발력으로 판을 지배할 주인공은 누구?!","i":"6b91fb83-7b31-4c21-9795-d6b7e52e0b95.png","a":"AEABAAAAAAA="},{"n":"환상의 트리오","t":"보드게임","c":"거짓말","v":0,"l":"초급","p":"5 ~ 7인","m":"30분","d":"정확히 3명만 O를 외쳐야 보물을 얻는다! 선 넘는 순간 모두가 파멸하는 극강의 눈치 블러핑 파티 게임! 매 라운드 공개되는 보물을 차지하기 위해 다양한 직업 능력을 쓰고 치열하게 대화하세요. 욕심이 과해 3명이 넘어도 실패, 눈치 보다가 3명이 안 되어도 실패! 오직 '딱 3명'의 합의를 이끌어내고 보물을 독차지할 최고의 전략가는 누구?!","i":"cff82c98-36f5-44b0-96ea-20d055e2627e.png","a":"AAABAAAAAAA="},{"n":"점박이","t":"보드게임","c":"주사위","v":0,"l":"초급","p":"1 ~ 4인","m":"10분","d":"어떤 강아지에게는 점이 있어요. 주사위에도 점이 있죠. 주사위를 알맞게 배치해서 강아지의 무늬를 완성하고 점수를 얻으세요!!","i":"fb0a39eb-eefe-46f6-9db5-3fa575367d0b.png","a":"AAABAAAAAAA="},{"n":"벌레가 싫어!","t":"보드게임","c":"심리전","v":0,"l":"초급","p":"2 ~ 6인","m":"15분","d":"풀밭에는 온갖 종류의 벌레가 살고 있습니다. 벌레가 나한테 모여들지 않도록, 벌레가 전부 남한테 가도록, 카드를 조심히 펼치세요! 벌레가 가장 적게 모인 플레이어가 승리합니다!","i":"c242d5c9-4db8-4b87-9a40-ed6f7b49ea11.png","a":"AAABAgAAAAA="},{"n":"태그팀","t":"보드게임","c":"카드전략","v":0,"l":"중급","p":"2 ~ 2인","m":"15분","d":"파이터 간의 연계를 고민하고, 상대의 허를 찌를 새로운 전략을 세워라! 대결을 펼칠 준비가 되셨습니까?? 라운드 1, Fight!!","i":"21a70cbe-c660-4699-8b1f-6a9b7a97e69c.png","a":"AAABAAAAAAA="},{"n":"이리하여 나는 독재자가 되었다","t":"보드게임","c":"파티","v":0,"l":"중급","p":"4 ~ 6인","m":"30분","d":"선도 악도 탈락도 불공평함도 없는 마피아 게임!! 그저 투표를 하고 카드를 버리세요. 마지막까지 당신이 손에 쥔 카드가 당신의 역할이 됩니다. 조건을 만족하는 역할을 남겨 승리를 쟁취하세요!","i":"352e05d3-52c4-4e58-a766-3c2e7ca56031.png","a":"gAQDAAAAAAA="},{"n":"마이티","t":"보드게임", XgCBlwCk="},{"n":"별빛 하늘에 소망을","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"6 ~ 7인","m":"150분","d":"\"세계 최초 우주도시에 우주종합대학 \u003c코스믹 가든\u003e 이곳에 입학할 후보생들이 올라탄 연락선 안에서 폭발이 발생했다. 연락선은 기능을 멈췄고, 창밖에는 멀어져 가는 후보생 한 명의 그림자가 보인다.\"","i":"e5656741-ab64-4da8-ad58-237a8ec3d634.jpg","a":"AUALAIAkACE="},{"n":"그러는 너는 어떤데?","t":"머더미스터리","c":"머더미스터리","v":0,"l":"초급","p":"3 ~ 6인","m":"20분","d":"서양식 저택 파티에서의 참혹한 살인 사건... 오브제처럼 장식되어 있는 시체와 피로 적혀 있는 '다음은 바로 너다.' 범인이 누구냐고? 나만 아니면 돼!!","i":"d93682a5-98ef-4d5b-8680-2789c5a0ac84.png","a":"AAADAAAIACI="},{"n":"퇴사하자마자 하필 이세계 소환된 건에 관하여","t":"머더미스터리","c":"머더미스터리","v":0,"l":"초급","p":"5 ~ 5인","m":"150분","d":"나는 퇴사했다. 우여곡절은 많았지만 드.디.어 탈출했다. 사직서를 제출하고 집에 가던 길 그런데.... 트럭에 치였다.. 아니 하필? 지금?? 눈을 뜨자 초록 숲에 초록 오크들. 그리고 한 오크가 말했다. \"족장이 죽었다. 이세계에서 온 자여. 네가 심판관이 되어 범인을 밝혀라.\" 이렇게 나는 또 다시 팔자에도 없는 범인 찾기에 참여하게 되었다...","i":"c5221d89-b5c6-4e87-9832-ba470bfb2a63.jpg","a":"AAALAAAAAAA="},{"n":"머더 미스터리 오브 더 데드","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"7 ~ 8인","m":"180분","d":"\"좀비 바이러스의 확산으로 붕괴된 인류 문명. 일본 어느 교외의 쇼핑몰에서 살아가는 생존자들. 어느 날, 그들 중 바이러스의 항체 혈청 위치를 알린 남자가 살해당하는데..\"","i":"4fb78659-ba24-4a50-879e-77b8956a6d36.jpg","a":"IEAHAABkACE="},{"n":"경성야화록","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"2 ~ 2인","m":"120분","d":"통행금지가 시작되기 직전, 작은 다방에서 마감을 맡았던 직원이 죽은 채 발견되었다. 사인은 독살. 사망 시점은 마감 직후. 그날 밤, 다방에 남아있던 사람은 네 명 뿐이었다.","i":"7d7e6643-796a-46da-9b45-b83128b5de08.jpg","a":"AAADAAAAAAA="},{"n":"알바트로스의 황금비","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"5 ~ 6인","m":"150분","d":"태평양 한 가운데 위치한 악명 높은 감옥, 알바트로스.. 이 지옥에 엄청난 허리케인이 몰아치며 교도관들이 모두 대피해버린다. 이 틈을 타 장기복역수들은 탈옥을 결심하는데...","i":"c40b3e2f-aeb2-4c22-a46f-5dc249cd28e4.jpg","a":"AVAPgIBgACE="},{"n":"클리어","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"2 ~ 2인","m":"60분","d":"당신은 '아르카디아 호'의 승무원으로서, 인류의 존망을 건 자원 탐사를 성공적으로 완수하였다. 총 581일 간의 긴 여정 끝에 정거장 복귀를 앞둔 그날… 선장이 실종되고, 암전된 선내에서 'Clear'라는 단어가 발견되는데..","i":"a08f9945-2778-4fc1-9215-9c679e919d1d.jpg","a":"AAABAAAAAAA="},{"n":"고스트","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"2 ~ 2인","m":"60분","d":"범국가적 범죄자 'Ghost' 당신은 그를 진압하기 위해 투입된 군인이다. 문을 박차고 총구를 들이민 순간, 당신의 눈 앞에 보이는 아군의 군복 그 순간, 당신은 상부를 통해, 'Ghost'는 타인의 몸으로 이동할 수 있다는 교신을 듣게 된다.","i":"7d3a2244-cb94-41fc-8028-bd7e0429c603.jpg","a":"AAAhQAAAAAA="},{"n":"데칼코마니","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"2 ~ 2인","m":"60분","d":"불의의 사고로 팔을 잃어버린 당신. 불법 재생 시술을 받기 위해 한 병원으로 향한다. 그리고 그곳에서 마주한 것은, 다름 아닌 당신의 모습이었다.","i":"38c347b4-c611-449b-9d9b-433a972142cd.jpg","a":"AAABAAAAAAA="},{"n":"랭던가의 망령","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"2 ~ 2인","m":"80분","d":"30년간 폐가였던 랭던가의 저택. 모종의 이유로 이곳을 찾은 중년의 남자, 그리고 만나게 된 의문의 청년 이 사람은 누구이며, 왜 이곳에 와 있는가??","i":"10bb8757-06e3-4fcc-b77b-25a067f79d9b.jpg","a":"AAABAAAAAAA="},{"n":"낙원의 밤","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"2 ~ 2인","m":"100분","d":"Z바이러스가 창궐한 뒤, 인류는 작은 셸터 낙원에 모여 살고 있습니다. 그러나 평화로운 생활도 잠시, 한밤중에 구성원 레나가 살해된 채 발견되는데…. 외부와 단절된 공간 속에서 서로를 의심하며 진범을 밝혀라!","i":"7d196981-5176-4bb0-a2a6-caf96fbf90ac.jpg","a":"AAADQAAAAAA="},{"n":"제아의 눈","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"2 ~ 2인","m":"100분","d":"역사와 전통을 자랑하는 래플 기숙학교. 여러분은 높은 경쟁률을 뚫고 래플 기숙학교에 입학한 선택받은 존재들입니다. 학교의 이름을 드높이고 나아가 꿈을 이뤄내며 행복한 미래를 실현시키세요!","i":"e19c9635-261d-441b-8238-16f5e371d32c.jpg","a":"AAADQAAAAAA="},{"n":"무너져가는 고성에서 피어나는 것은","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"2 ~ 2인","m":"100분","d":"고등학교 동창인 제로와 카이는 함께 고성 체험을 갔다가 불의의 사고로 성에 고립되고 맙니다. 제로와 카이는 무사히 성에서 탈출할 수 있을까요??","i":"e78e2a04-4b8e-406f-a4ab-4b65dcff650c.jpg","a":"AAADQAAAAAA="},{"n":"타워","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"4 ~ 4인","m":"150분","d":"이곳은 타워. 벙커에 드렁가지 못한 낙오자들의 모임. 정의롭기로 소문난 리더, 그를 중심으로 사람들은 모였고 도시에서 2번째 큰 생존자 그룹이 되었다. 하지만 리더가 죽는다면? 사람들이 과연 정의를 지킬까? 타워는 무너지고 있다.","i":"0923f0e6-b89f-4f74-81c7-236a20cc052a.jpg","a":"AAADAAAAAAA="},{"n":"두개의 시간","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"2 ~ 4인","m":"60분","d":"한 남자가 누군가를 찾고 있었다. \"최작가! 최..작..최작가!!!!!\" 사건 발생 1시간만에 최작가는 동료인 나엉석PD에게 발견됐다. 그녀는 화장실 변기에 앉아 칼로 만들어진 웃음을 지은 채 죽어있었다.","i":"f83585dd-03d3-422b-9521-99ad2a47f01e.jpg","a":"AAADAAAAAAA="},{"n":"두개의 시간2 - ㅁ의 열쇠","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"2 ~ 4인","m":"120분","d":"2024년, 두개로 갈라졌던 시간. 그로부터 약 1년 뒤, 다시 시작된 시간의 충돌! 하루 아침에 조선시대로 떨어진 '추우리'의 고군분투 생존기 사건을 해결하지 못하면 친구가 죽는다. 역사 속에 묻힌 그날의 진짜 이야기, 수수께끼를 풀어 그 진실을 밝혀라!","i":"b2345854-5453-4aba-ad61-6ba148e9a353.jpg","a":"AAADAAAAAAA="},{"n":"축시의 저주술 오브 더 데드","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"6 ~ 6인","m":"150분","d":"축시의 저주에 온 다섯 명의 여성. 그리고 하나의 시체. 저주한 자, 저주받은 자, 저주를 목격해 버린 자――. 이계가 된 경내에서의 생명의 추리극","i":"047cf118-708e-4994-85e7-e991fbcdd6c3.jpg","a":"AAAAAAAAAAA="},{"n":"동굴 속 비밀들","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"4 ~ 4인","m":"90분","d":"석상이 된 그의 손끝에서 흘러나오는 기묘한 마력이 그녀의 추악한 비밀을 가리키는 가운데, 요정 조사관의 날카로운 심문이 시작된다. 당신은 조작된 증거를 뚫고 인류와 요정계를 뒤흔들 음모를 막아낼 수 있는가?","i":"11fc110a-a91c-4f15-b6b0-8b0edc0d2b60.jpg","a":"AAAAAAAAAAA="},{"n":"이 늪에 죽음을 버릴 생각으로","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"4 ~ 4인","m":"100분","d":"기적을 바라고 모여든 조사자들, 그리고 살인범을 잡지 않으면 치유 의식을 중단하겠다는 마녀의 서늘한 경고! 당신은 추악한 진실을 발혀내고 치유받을 수 있을 것인가?","i":"556e2f16-0c4b-4360-8826-0aa744b891f2.jpg","a":"AAAAAAAAAAA="},{"n":"마녀사냥","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"5 ~ 5인","m":"120분","d":"마녀라는 정체를 숨긴자, 도벽에 눈먼 목격자. 복수심에 눈이 멀어 광기 어린 연극을 시작한 진범은 누구인가!","i":"786ea7a3-d288-4127-8e41-c92d452ce6ba.jpg","a":"AAAAAAAAAAA="},{"n":"유적 아래의 진실","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"5 ~ 5인","m":"60분","d":"시간마저 어긋난 이 지옥같은 공간에서 당인은 고대의 비밀을 풀고 무사히 지상으로 돌아갈 수 있을지? 아니면 어둠 속 짐승의 제물이 되어 영원히 유적의 일부로 남게 될 것 인지? 생존을 건 고고학적 공포 미스터리!","i":"1ec11409-b65e-472d-9aff-a3faf14c06cc.jpg","a":"AAAAAAAAAAA="},{"n":"초급 던전 기획 4팀","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"5 ~ 5인","m":"90분","d":"팀장이 아끼던 희귀 식물의 싸늘한 죽음과 함께 시작된 의심의 눈초리! 당신은 수상한 행적을 추적해 '식물 살해범'의 정체와 그날 밤의 진실을 밝혀낼 수 있는가? 칼 대신 서류 봉투를 든 용사들의 기상천외한 오피스 추리극!","i":"90d40c8c-999c-4f28-8b3b-d32d4db11a99.jpg","a":"AAAAAAAAAAA="},{"n":"붉은길","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"7 ~ 7인","m":"120분","d":"천재 작가 '백야'의 노엘 문학상 수상을 축하하기 위한 호화 크루즈 파티. 하지만 축제의 환호도 잠시, 작가가 살해되고 전 선내를 패 1109938b4.jpg","a":"///79+8v3z8="},{"n":"숨겨진 이야기 H","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"4 ~ 4인","m":"120분","d":"원인 불명의 바이러스가 전 세계를 덮쳤다. 바이러스 치료제를 개발 중이던 천재 의사가 살해 당하는데.. 범인은 누구일까? 인류의 미래는 어떻게 되는 것일까?","i":"6f90b057-b05f-47bd-8792-5e19bdd5c6a1.jpg","a":"hVkfdMhlkik="},{"n":"안개가 떨어지는 고개","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"4 ~ 4인","m":"60분","d":"안개가 걷힌 후 당신이 마주할 진실은? 한치 앞도 보이지 않는 안갯속. 당신도 피해자가 될 수 있다! 사무라이 시대극 배경의 머더 미스터리.","i":"868a6b2b-5a1d-4279-bd95-783b7027b870.jpg","a":"s9330vRthi8="},{"n":"보랏못 리라이트","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"2 ~ 2인","m":"60분","d":"친자매처럼 자란 두 소꿉친구가 생각지 못한 사건에 휘말린다. 깊은 산속 갬핑장에서 발견된 관리인의 시체. 두 사람은 진상을 밝힐 수 있을 것인가?","i":"eba2c74e-1923-4f63-9ef3-586ae551a228.jpg","a":"////9+9//z8="},{"n":"시체와 온천","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"4 ~ 5인","m":"60분","d":"노천탕에서 한 남자의 시체가 발견되었다! 온천 여관의 투숙객인 여러분은 용의자가 되었습니다. 과연 여러분은 \u003c온천 여관 살인 사건\u003e의 진상을 파헤칠 수 있을까요?","i":"24ea2595-9095-4b97-9b52-304d2fc5aaf7.jpg","a":"////9u5/3z8="},{"n":"카나리아는 지저귀지 않는다","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"4 ~ 4인","m":"90분","d":"테러 조직을 쫓던 CIA 잠입 공작원 '카나리아'가 죽었다. 어째서 그녀가 죽었을까? 죽음의 진상을 뒤쫓고 테러를 막아야 한다. 두 명의 CIA 공작원과 두 명의 공안 경찰관이 수사를 개시한다.","i":"727699db-91c5-44f3-8fb3-a7a334000276.jpg","a":"hcn/84xtji8="},{"n":"문스톤 저택 살인 사건","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"4 ~ 4인","m":"90분","d":"추리 소설을 좋아하는 귀족 문스톤 경이 명탐정 4명을 초청했다. 그날 밤, 문스톤 경이 독살당한 시체로 발견되었다! 명탐정들이 나설 차례다. 문스톤 경이 그들을 초대한 이유는 무엇일까?!","i":"a00a5bca-caca-444b-880c-a58ea66ba905.jpg","a":"3///08x/zz8="},{"n":"시간을 달리는 트라이앵글","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"3 ~ 3인","m":"90분","d":"어느 대학의 오컬트 연구회 기념 행사 중 회장이 사망했다! 범인은, 남겨진 회원 셋 중에 있다!? 수수께끼와 초자연 현상. 시간을 달리는 트라이앵글.","i":"3cf2840d-6852-4045-87a9-931c86244d32.jpg","a":"r9//9s99ni8="},{"n":"다크 율에 속죄를","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"7 ~ 9인","m":"180분","d":"10년에 한 번 열리는 흡혈귀들의 대집회. 그곳에서 대립중인 두 파벌의 2인자 중 한 명의 시체가 발견된다. 피비린내 가득한 하얀 어둠의 밤으로 당신을 초대합니다.","i":"de4706b1-4b76-4f0a-8cb6-5c2ffc22386f.webp","a":"BVkLAIAIgCU="},{"n":"마녀는 황혼의 종에 사라진다","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"6 ~ 7인","m":"150분","d":"7년 전 폐쇄된 여고의 옛 건물, 예배당의 종소리가 울려 퍼진 날, 한 남자가 시체로 발견되었다.","i":"018a0020-f69d-40b6-9efc-02b762bd3d0a.webp","a":"BVgLAMAIACE="},{"n":"끝나지 않는 한여름","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"8 ~ 9인","m":"180분","d":"유령이 되어 자신의 장례식을 바라보고 있는 청년. 죽기 전 며칠간의 기억이 없다. 장례식에 온 친구들은 알고 있을까? 과거에 사로잡힌 친구들이 빚어내는 추억과 재생의 크라임 씬.","i":"2ddf2488-df1b-4ba2-99fd-8fd509beffed.jpg","a":"9f2z1ooJBi8="},{"n":"죄와 벌의 도서관","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"5 ~ 6인","m":"150분","d":"도서관에 '읽으면 죽는 책'이 있다는 소문이 있다. 도서관 개관 3주년 기념일에 발생한 도서관장의 죽음. 자살일까? 타살일까? 이미 넘긴 페이지는, 되돌릴 수 없다.","i":"ee073432-2cad-4738-be72-1547660b5862.jpg","a":"lV2/0uBlgi4="},{"n":"구두룡 저택의 살인","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"7 ~ 9인","m":"120분","d":"저택 지하실에서 영능력자가 시체로 발견되었다! 마녀의 피를 이어받은 영능력자, 저택에 내려오는 고대 괴물의 전설. 강령회에서 발생한 살인사건의 진상을 밝혀라!","i":"4760d611-e801-4450-a42e-7e9c0d5adb47.jpg","a":"tV2z0gIBAi8="},{"n":"늑대인간 마을의 축제","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"7 ~ 8인","m":"120분","d":"깊은 숲속 작은 마을, 이 마을엔 늑대인간의 전설이 내려온다. 오늘, 여관에서 발견된 상인의 시체. 늑대인간의 소행인 것일까? 서로를 의심하는 마을 사람들. 용의자가 된 당신. 진범을 밝혀내야 합니다.","i":"003a5e17-c829-4d17-b820-5e5255bf4947.jpg","a":"9f3/1qpt1i8="},{"n":"몇 번이고 푸른 달에 불을 붙였다","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"6 ~ 7인","m":"150분","d":"마을 사람들의 존경과 두려움의 대상인 마피아 보스 로자넬라. 그는 머리에 피가 흐르는 모습으로 숨진채 차고에서 발견되었다. 그를 살해한 진범은 누구일까? 충격과 반전의 스토리!","i":"c37b2682-3ce4-4684-946c-baf0b94bfb54.jpg","a":"9///tqpt1i4="},{"n":"탐욕 : Part 01 탐욕의 저택","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"4 ~ 4인","m":"150분","d":"66일 동안 낯선 타인과 함께 외부와 단절된 장소에서 생활할 것. 마지막 날까지 버티면 상금 1억원. 그리고 몇 가지 규칙들….. 그 아래 아무 설명 없이 적힌 주소 하나.","i":"d25f5cb3-9811-48fe-81b8-29ebcebc7870.jpg","a":"b3271vIbCi8="},{"n":"다시금 피어난 불꽃은","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"5 ~ 5인","m":"150분","d":"범죄, 질병조차 없는 완벽한 이상세계. 불행한 일은 절대 일어나지 않는 이곳에서 폭발과 함께 사람이 죽었다. 완벽한 세계가 깨지던 순간, 그곳에는 다섯 명의 사람들이 있었다.","i":"dbbeae3d-0a70-450d-a47a-a9634d25a79c.jpg","a":"5v+71+6bIi8="},{"n":"판도라의 택배","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"5 ~ 5인","m":"120분","d":"문 앞에 높인 정체불명의 택배에는 시체가 들어있었다. 판도라 가구 창업주 강한필 회장의 죽음과 그에 얽힌 비밀. 그리고 물밑에서 벌어지는 사투. 진실을 밝혀낼 수 있을까?","i":"99968b81-5fcd-4ed4-94b8-7c5244caf14e.jpg","a":"5v661+ybKi8="},{"n":"어느 괴도의 딜레마","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"2 ~ 2인","m":"60분","d":"일본 머더 미스터리 앱 'UZU' 어워드 수상작! 세상을 떠들썩하게 했던 2인조 괴도 딜레마가 마침내 런던 경시청에 잡혔다. \"협력이냐, 배신이냐.\" 숨막히는 두뇌 싸움이 시작됩니다.","i":"524e1d26-6ab6-4bd4-8b22-38bbee2ad775.jpg","a":"81m/9utvri0="},{"n":"괴조는 깊은 탄식의 끝에","t":"머더미스터리","c":"머더미스터리","v":1,"l":"고급","p":"4 ~ 4인","m":"120분","d":"당신은, 아마도, 이 수수께끼를 풀지 못할 것이다.","i":"73dc8dbb-1f36-4fdc-86f7-c92ca246f315.jpg","a":"IFgbpAAJACE="},{"n":"새장 속 제비는 꿈을 꾼다","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"7 ~ 9인","m":"180분","d":"19세기, 야간 열차에 탑승한 여러분은 하나의 사건을 마주하게 된다. 201호에서 숙박을 하던 남성이 시체로 발견되었다. 승객들 중 범인이 있다. 진상을 밝히고 범인을 잡을 수 있을 것인가.","i":"2163fde6-8af8-4b43-95a6-3058c5fe9a58.webp","a":"AEgKIEAAAAA="},{"n":"4명의 탐정과 물의 유령","t":"머더미스터리","c":"머더미스터리","v":0,"l":"초급","p":"9 ~ 9인","m":"90분","d":"정령, 신, 인간이 공존하는 신비의 나라. \u003c물의 도시\u003e '물의 유령'이 나타나 물건을 훔치고 마을의 젊은 여성들이 행방불명되고 마을 촌장의 딸까지 실종 되며, 촌장은 용의자들과 탐정을 불러 수사를 시작한다.","i":"cfdd8cdf-369b-4e4a-9473-1cb520770426.jpg","a":"AEADAAAAACg="},{"n":"운명의 세 여신 EP1. 베르단디","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"4 ~ 4인","m":"120분","d":"*플레이 순서 : 베르단디→스쿨드→우르드 운명의 세 여신 첫 번째 이야기. 사건의 서막. 경찰서장 김기태의 죽음, 기억을 잃고 쓰러졌던 이진욱이 체포된다. 과연 그는 '유죄'일까? 죽음 너머 숨겨진 진실을 찾아내야한다.","i":"fa743780-8f00-441f-9cd9-4bceb950f751.jpg","a":"vnmrgEYBAy8="},{"n":"살인 라이브","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"5 ~ 5인","m":"150분","d":"각 분야에서 큰 인기를 끌고 있는 유튜버들이 모였다. 폐교 안에서 금단의 강령술로 죽은 자를 부활시키는 콘텐츠를 촬영하는데.. 과연 강령술은 성골할 것인가? 지금 촬영이 시작됩니다.","i":"96ece355-ee88-4e94-8f82-496467a7a524.jpg","a":"n3C/0FIskgc="},{"n":"보통의 머더 미스터리","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"5 ~ 5인","m":"60분","d":"머더 미스터리가 생소하다면? '보통의 머더'로 입문하세요! 간결하고 친절한 설명, 컴팩트한 구성물로 입문자도 쉽게 즐길 수 있습니다.","i":"371f96d1-10c5-47a1-a260-78ad46e3d957.jpg","a":"vHe7tnIhAy8="},{"n":"흑백 해로","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"2 ~ 2인","m":"150분","d":"\"호화 여객선 투어 중 여섯 명의 승객을 제외한 모두가 사라졌다. 그리고 테라스 레스토랑의 샹들리에에는 남자의 시체가 매달려 있다. 이 이상 사태와 수수께끼를 해결하기 위해 당신들은 진실에 다가서게 된다.\"","i":"103301b6-0cab-40dd-9e26-e4aed9bd5abe.jpg","a":"gUMH4IhEjCE="},{"n":"용사가 죽었다","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"6 ~ 8인","m":"180분","d":"마왕의 부활로 시작된 마족과의 기나긴 전쟁의 최종 국면. 인류의 사활을 건 마지막 전쟁을 앞두고 용사가 죽었다. 용사 살해범은 누구일까? 세계의 운명은 어떻게 될 것인가?","i":"c1ff662e-f804-4f37-bb1e-2ac05bcb35dd.jpg","a":"sV23kuJtgi8="},{"n":"별장 살인","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"5 ~ 6인","m":"60분","d":"셰프 고준수의 별장에서 열린 파티에서 젊은 미식 평론가가 시체로 발견된다. 각자의 복잡하게 얽힌 사연을 풀어나가며 사건의 진상을 밝히세요. 짧은 시간에도 다인용 머더 미스터리의 진수를 느낄 수 있습니다.","i":"0ab7561b-afee-4e3b-98d9-7c474706038c.jpg","a":"/v//1+4bXz8="},{"n":"데드 박스","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"2 ~ 2인","m":"60분","d":"엘리베이터의 시체와 함께 남겨진 두 사람. 과연 시체는 누구이며, 두 사람은 왜 이곳에 있는 것일까? '협력'과 '배신'이 오가는 2인용 머더 미스터리!","i":"059e1ba4-5fd6-40f0-8ef9-7c1958db8295.jpg","a":"8nz71usLPy8="},{"n":"동자","t":"머더미스터리","c":"머더미스터리","v":0,"l":"중급","p":"2 ~ 2인","m":"60분","d":"아이를 품에 안은 한 여인이 신당 안으로 들어온다. \"신녀님… 저희 아이가.. 이상해요..\"","i":"3256b072-3c5e-45aa-9d8d-d312f153ca65.png","a":"AAALAAAAAAA="},{"n":"이스터 에그","t":"머더미스터리","c":"머더미스터리","v":0,"l":"초급","p":"1 ~ 5인","m":"120분","d":"이것은 우리가 알고 있는 추억 속 게임의 이야기. 그러나 우리가 알지 못한 NPC들의 이야기","i":"40e446bb-7419-477b-8c7b-f0d817f32fe8.png","a":"AAAJAAAAAAA="},{"n":"빨간 모자, 무도회에서 시체와 만나다","t":"머더미스터리","c":"머더미스터리","v":0,"l":"초급","p":"4 ~ 4인","m":"120분","d":"지금까지 이런 머더 미스터리는 없었다! 이것은 동화인가 머더 미스터리인가?!","i":"e0df2316-1a1a-4446-bf68-647b74844cbe.png","a":"AEAJAAAAAAA="},{"n":"일백마을 살인사건","t":"머더미스터리","c":"머더미스터리","v":0,"l":"초급","p":"4 ~ 5인","m":"120분","d":"1985년 X월 XX일, 매일경찰서에 한 우편이 전달된다. 혼자 우편을 이리저리 접어본 나경찰은 우편에 숨겨진 메시지를 읽게 되고, 사건을 조사하기 위해 조심스럽게 일백마을로 향한다.","i":"93a74401-058a-461d-9d9c-c05991825941.png","a":"AAAIAAAAAAA="},{"n":"만월사당 살인사건","t":"머더미스터리","c":"머더미스터리","v":0,"l":"초급","p":"5 ~ 6인","m":"150분","d":"발자국은 하나. 불가능한 자살. 그리고 철저한 규율 속 숨겨진 만월사당의 진실. 거짓의 흔적에서 결정적 증거를 찾아 진실을 밝혀라.","i":"cdc03501-881a-40a0-96a8-f4e972a2087d.png","a":"AAAAAAAAAAA="},{"n":"기계섬기담","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"6 ~ 6인","m":"180분","d":"하루 아침에 생겨난 인공섬 '기계섬'. 그곳의 주인인 박사가 2m가 넘는 큰 바위에 깔린 채로 살해당했다. 기묘한 죽음의 진실과 기계섬에 얽힌 비밀을 파헤친다.","i":"8fbbe2a5-460e-4c83-9a72-1c42646126bd.jpg","a":"AAADAAAAAAA="},{"n":"꽃이, 지던 날","t":"머더미스터리","c":"머더미스터리","v":0,"l":"초급","p":"4 ~ 4인","m":"120분","d":"오직 기쁨과 평온만 허용하는 '감정 안정화 칩'이 뇌에 심어진 미래의 인류. 감정결핍으로 인한 문제를 극복하고자 '사랑'을 만들어 내는데.. 그녀가 살해당했다.","i":"dd7b0daa-5807-4418-8f33-7ab377d0c198.jpg","a":"AEACAAAAAAA="},{"n":"다니오","t":"머더미스터리","c":"머더미스터리","v":1,"l":"중급","p":"5 ~ 5인","m":"180분","d":"비약적으로 발전한 기술과 반대로 바닥을 기는 윤리 의식. 정체불명의 연구 집단 'PBD'와 어린 아이들의 집단 사망. 아쿠아리움 수조 위에 떠오른 시체 한 구. 얽혀있는 비밀을 풀어내야 한다.","i":"ec610b6a-5ccd-4dbd-b23d-63895325d204.jpg","a":"p2U7xsw5Ui8="},{"n":"개화, 꽃피우다","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"4 ~ 4인","m":"150분","d":"\"숨겨진이야기H\"를 먼저 플레이 하시길 바랍니다. 대한민국 상위 1% 수재들만 입학하는 한국 대학교. 미스터리 동아리 회장인 [최정상]이 연설 중 쓰러져 사망한다. 범인은 누구일까?","i":"2b59b1d3-0281-4a3c-8b33-8fd689519aad.jpg","a":"hVkfRMBlgik="},{"n":"삿포로 이세계 투어","t":"머더미스터리","c":"머더미스터리","v":0,"l":"초급","p":"4 ~ 4인","m":"100분","d":"[교토 이세계 투어]를 먼저 플레이 하시길 바랍니다. 정식적인 \u003c문\u003e을 통하지 않고 이세계에 섞여 들어온 세사람. 그들은 입국 관리 조사관과 함께 검게 탄 시체와 조우하게 되는데..","i":"9430c6ea-099d-4a36-8399-683c88911daa.jpg","a":"AUEH4IhkhCE="},{"n":"프로젝트 노아","t":"머더미스터리","c":"머더미스터리","v":1,"l":"중급","p":"4 ~ 4인","m":"180분","d":"지구의 영토를 우주로 확장하는 계획 '프로젝트 노아'. 우주선 노아호의 선장이 살해당했다. 개인의 목표, 공동의 목표 그리고 노아호의 진실을 밝혀내자!","i":"6e6e43a2-763d-49b6-b35b-a0bdee49db9a.jpg","a":"v92/1+ptzSs="},{"n":"사해","t":"머더미스터리","c":"머더미스터리","v":1,"l":"중급","p":"5 ~ 5인","m":"150분","d":"현대 과학 기술로도 탐지 불가능한 신묘한 섬 사해. 그곳의 가문들이 가진 비밀과 총장의 사망. 진실을 밝혀내야 한다.","i":"a4b5c2c3-dfbc-46de-b516-92e8f3f9bf57.jpg","a":"hkE7wIg4Qi8="},{"n":"수상한 한의원","t":"머더미스터리","c":"머더미스터리","v":0,"l":"초급","p":"3 ~ 3인","m":"120분","d":"귀신을 보는 능력으로 한을 풀어주던 한의사에게 의뢰가 들어왔다!","i":"ade2f996-6a97-4536-86bf-1e8dfb9ee075.jpg","a":"AAACAAAAACA="},{"n":"마음을 모아 비는 소원","t":"머더미스터리","c":"머더미스터리","v":0,"l":"초급","p":"5 ~ 5인","m":"120분","d":"과거의 어떤 일 이후로 뿔뿔이 흩어진 우리, 9년 만에 육철의 부탁으로 다시 모인 자리에서 마주한 그의 시체! 범인은 누구인가...","i":"347fc007-795c-42ca-b4cb-779c29a11ee5.jpg","a":"ABACAAAAACA="},{"n":"지구에서 사랑을 담아","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"7 ~ 7인","m":"120분","d":"머나먼 미래, 식량을 확보할 수 있는 행성을 찾는 여행 중 우주생물과의 전투에 휘말려 목숨을 잃게 된 학자. 그리고 지구에 도착을 앞둔 이날, 또 한 명의 희생자가 발생한다.","i":"4a2538bb-dce1-42a8-b260-3a195f379e48.jpg","a":"AEACAAAAAAA="},{"n":"이 어둠을 당신과","t":"머더미스터리","c":"머더미스터리","v":1,"l":"중급","p":"6 ~ 6인","m":"180분","d":"일본 머더 미스터리 2024 설문 평점 1위! 밀실 안에서 발견된 시체. 살인일까? 아니면 자살일까? 인간도, 악마도 행복을 원한다. 하지만 지옥으로 가야할 때가 있을 수 있다.","i":"72da87a5-f947-4904-9bc9-f21a75ad4280.jpg","a":"AEACAAAAAAA="},{"n":"레드X리그렛","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"5 ~ 5인","m":"120분","d":"여러분은 지금부터 데스게임을 플레이합니다. 낡은 저택의 로비, 다섯 명이 가죽 의자에 묶여 있다. 가장 죄가 무거운 사람을 처형하는 데스게임에서 누가 처형될 것인가..","i":"5de34d10-2c50-4003-a544-9d23190c158e.jpg","a":"AFEDAIAgCAg="},{"n":"킬 더블유","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"6 ~ 6인","m":"150분","d":"[GM 필수] 피로 적은 다잉 메시지는 다섯 글자. KILL W","i":"0a8d8a6b-d081-48f9-913e-0f6ffec6e6b3.png","a":"AAAIAAAAAAA="},{"n":"최종 프로토콜","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"5 ~ 7인","m":"90분","d":"2047년, 거대 테크 기업의 창립자 '올리비아'가 자신의 최첨단 저택에서 비공개 파티를 열었다. 그러나 다음 날, 그녀가 시체로 발견되었고 저택에는 자동 보안 프로토콜이 발동됐다. 진실을 찾기 전까지는 아무도 나가거나 들어올 수 없다.","i":"b591a494-8c65-4dca-8dd8-bf2da6c2022d.png","a":"AEEKAAAAAAA="},{"n":"천멸급 전사의 두 번째 역전극","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"7 ~ 7인","m":"240분","d":"'[GM 필수] 세레스타인 제국이 자랑하는 건국 150주년 무도회. 원래라면 귀족과 고관, 성직자들이 모여 화려하게 축하해야 할 이 밤.. 한 통의 소식이 잔치에 은밀한 그림자를 드리운다..","i":"14257e4a-1b2e-46f3-9c89-2ea5c65a606e.png","a":"AAAIAAAAAAA="},{"n":"래빗","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"5 ~ 5인","m":"120분","d":"1년에 단 한 번 열리는 비밀 경매가 오늘 밤, 호화 크루즈에서 개최된다. 경매장의 규칙은 단 하나. 이름도, 얼굴도, 신분도 숨긴 채 가면을 쓰고 진행된다. 크루즈에선 정전이 일어났고 얼마 지나지 않아 전력은 복구되었으나, 경매장의 주인 토끼 가면의 남자가 죽어있었다.","i":"768b8ad4-c767-42fa-88dc-c512daca4403.jpg","a":"AAEIAAAAAAA="},{"n":"유령섬 살인사건","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"4 ~ 4인","m":"60분","d":"대학 시절 테니스 동아리원이었던 여섯 친구. 졸업 여행에서 한 친구가 사고로 죽었다. 그리고 3년 후 같은 섬에서 모인 5명 중 한 명이 같은 곳에서 죽는다. 사건의 진실은 무엇일까? 4부작으로 이어지는 추리 서사시. (반드시 순서에 맞게 플레이 해주세요!)","i":"eb3bb9b2-8270-441b-be8f-8c51c55c7cf3.jpg","a":"AUAHBABkgAE="},{"n":"데드 헤드 대드","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"2 ~ 2인","m":"120분","d":"복제 인간 기술이 발달한 미래. 신체를 넘어 인간의 기억과 자아를 복제하여 의체에 이식할 수 있게 되었다. 그러던 어느 날 의체 서비스를 남성이 시체로 발견되었다. 두 사람은 피해자의 동선을 따라가며 수사를 시작하는데..","i":"555f8872-716e-4b79-bb88-3f95e040d087.jpg","a":"IUE/1KBtiCU="},{"n":"미스터리 포켓 : 막이 내리다","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"3 ~ 6인","m":"60분","d":"여러분은 이제 유명 소설가가 집필한 스릴러 사건의 주역이 됩니다. 범인은 여러분 안에 숨어 있습니다. 무사히 범인을 찾아내고 자신의 무죄를 증명해 낼 수 있을까요?","i":"32e9fd1e-5784-4917-9773-f150bc7f265b.jpg","a":"AEACAAAkAAE="},{"n":"유각관의 살인","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"6 ~ 6인","m":"120분","d":"오컬트 연구 동아리에서 다함께 무인도 방문을 기획한다. 그러나 다음 날 아침, 기획자인 정유미가 시체로 발견된다. \"현아가 복수하러 온거야..\" 그들에게 얽힌 과거의 비밀은 무엇일까?","i":"476031c6-96e4-44f0-ba13-326f08948d34.jpg","a":"AEATAAAACCg="},{"n":"근무 중 이상... 있습니다?","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"4 ~ 4인","m":"60분","d":"누구나 즐길 수 잇는 군대 테마의 코미디 머더 미스터리! 사단장님이 방문하는 날, 부대 최대의 고문관인 김일병이 사라졋다. 헌병대가 들이닥치기 전에 김일병을 찾을 수 있을까요?","i":"0b1f4f94-8e34-46af-8a98-c5838d5c6bd7.jpg","a":"g3UblqjlGi0="},{"n":"종결사건 #1","t":"머더미스터리","c":"머더미스터리","v":0,"l":"초급","p":"5 ~ 5인","m":"90분","d":"'무당 유튜버의 욕실 사고사 역재생 영상에서 들리는 '살려 달라'는 목소리.. 죽은 유튜버의 다잉 메시지일까?!","i":"2adf22aa-18d5-4bfb-bc6f-8bc800b9be6f.png","a":"AAAKAAAAAAA="},{"n":"종결사건 #2","t":"머더미스터리","c":"머더미스터리","v":0,"l":"초급","p":"5 ~ 5인","m":"90분","d":"'백화점 마네킹 사건 사람들로 붐비는 백화점 안, 비명소리가 울려 퍼진다. 마네킹이 알고 보니 시체?!","i":"8b635886-8ed1-4529-b311-b48466187e1e.png","a":"AAAKAAAAAAA="},{"n":"0719 : 낙하를 향하는 두 개의 수","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"4 ~ 4인","m":"120분","d":"악몽을 꿨다. 한 때, 내가 다녔던 학교는 더 이상 폐교의 모습이 아니었고, 우리는 그녀가 죽었던 과거의 그날에 있었다.","i":"4dde0d9b-f2fe-49c3-9331-f7a6dadae6f4.jpg","a":"AFACAAAAAAA="},{"n":"원숭이의 죽음","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"5 ~ 7인","m":"90분","d":"범죄 조직의 일원인 여러분은 작전을 성공하고 은신처에 모였다. 갑작스러운 정전 이후.. 코드네임 '원숭이'의 시체가 발견됐다. 우리는 서로의 본명도 모른다.. 진실을 무엇일까?!","i":"2a73eebb-4e7c-4c57-8683-824c7774de5b.png","a":"AEEKAAAAAAA="},{"n":"문어형님 타코야끼 조리사건","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"4 ~ 4인","m":"90분","d":"문어파의 두목 돌문어가 살해당했다. 그의 다리가 타코야끼로 가공되어 밀매되기 전에 그를 죽이고 다리를 빼앗아간 녀석을 찾아내야 한다!","i":"23aad6a1-3fca-4f46-9dd5-b2f5a8331f20.jpg","a":"AEAGAAAgAAA="},{"n":"크림향 낭자한 만쥬의 죽음","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"5 ~ 5인","m":"90분","d":"모두가 모인 시각. 델리만쥬의 모습이 보이지 않았다. 델리만쥬 틀 안에서 죽은 채로 발견된 만쥬. 찐빵, 붕어빵, 호떡, 계란빵 4명의 용의자 중 범인은 누구일까?","i":"431a7724-f096-46a4-bddc-ec502d901780.jpg","a":"AEAGAAAgAAA="},{"n":"경성","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"4 ~ 4인","m":"90분","d":"마지막 남은 을사오적 이진용 백작. 그의 저택에서 살인 사건이 발생한다. 네 명의 손님, 네 개의 비밀. 식탁 위의 진실에 닿을 수 있는 자는 누구일까요?","i":"2790e039-2230-44b9-8165-c55faebeb1f6.jpg","a":"gkgrwAApii4="},{"n":"살인자의 집","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"2 ~ 2인","m":"90분","d":"몇 년 전. 엽기적인 연쇄 살인으로 유명해진 살인자의 집. 살인자는 현재 감옥에 수감 중이다. 폐허처럼 황폐해진 집에 기삿거리가 급한 B급 잡지사 기자가 방문하는데..","i":"5ccdf191-a91c-4eca-8837-3492ade54895.jpg","a":"s/c70u6rCi8="},{"n":"별빛 우주 페러렐라인","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"5 ~ 5인","m":"90분","d":"평행세계에서 모인 5명의 '나'. 그 중 한 명이 살해 당했다. 사건을 해결하고 내가 살던 현실로 돌아가야 한다..!","i":"be00212e-a167-4fcf-ab2f-5cba25b57a95.jpg","a":"AEAKAAAAAAA="},{"n":"별주부전 : 토끼의 죽음","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"5 ~ 5인","m":"100분","d":"우리가 알고 있던 전래동화가 아니다! 누가 토끼를 죽였을까?!","i":"40ac395a-0106-4e96-8542-ed49ccd11abd.png","a":"AAAJAAAAAAA="},{"n":"꼬마각시를 기다리는 밤","t":"머더미스터리","c":"머더미스터리","v":1,"l":"중급","p":"5 ~ 5인","m":"300분","d":"신당에 모인 여섯. 그중 한 명의 몸에 꼬마각시님이 빙의 한다. \"꼬마 각시님, 향단을 죽인 자는 누구인가요?\"","i":"bb95fd40-f2e4-4a0c-a0d1-1ea9b37c0aca.jpg","a":"AEACAAAAAAA="},{"n":"꼬리잡기 part,1","t":"머더미스터리","c":"머더미스터리","v":0,"l":"초급","p":"8 ~ 8인","m":"120분","d":"추리·스릴러물로 많은 사랑을 받은 네이버 웹툰 \u003c꼬리잡기\u003e가 8인용 머더 미스터리 2부작으로 출시! 긴장감 넘치는 전개 속에서 숨겨진 단서와 진실을 파헤쳐 보세요!","i":"0048fea4-37bd-48c6-8cd4-550f407dffe9.jpg","a":"AAACAAAAACA="},{"n":"디어와이","t":"머더미스터리","c":"머더미스터리","v":1,"l":"중급","p":"5 ~ 5인","m":"180분","d":"고통도, 상실도, 슬픔도 없는 평화의 섬 '아일랜드'. 그곳의 완벽한 요양 병원인 '유포리아'에서 최고 책임자인 로빈 박사가 살해당했다. \"우리를 행복에 이르게 하소서.\"","i":"57883044-0293-4ab4-bebc-a1d71d03cc7c.jpg","a":"p2U7xsw5Ui8="},{"n":"시인촌기담","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"6 ~ 6인","m":"180분","d":"전쟁 이후의 도쿄, 문화 잡지 [수경]에 연재 중인 소설가들과 편집자가 함께 시인촌으로 사원여행을 떠난다. 그곳에서 어떤 일이 기다리고 있는 지도 모르는 채..","i":"43078478-7d4d-4d00-b40e-3ad22144b3e8.jpg","a":"AEADAAAAAAA="},{"n":"우주의 오아시스","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"2 ~ 2인","m":"120분","d":"자원이 고갈된 지구에서 새로운 행성을 개척하기 위해서 우주로 떠난 우주선 오아시스호. 천 년 뒤에 눈을 떴어야 하는 선장 에릭이 200년 만에 눈을 떴다. 우주선의 AI 시리가 왠지 모르게 꺼림칙하다.","i":"aee3372a-d4e1-479d-9310-93a0fc1b58d0.jpg","a":"s/c70u6rAi8="},{"n":"죄수의 딜레마","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"2 ~ 2인","m":"120분","d":"현금 도난 사건이 발생하였다. 주요 용의자 두 사람이 잡혀 왔다. 이들은 서로 다른 방에 갇혀 심문을 받게 된다. 과연, 이들은 어떤 결말로 향하게 될 것인가?","i":"4e3b5f27-7031-4ca7-a488-fa291bb9e78a.jpg","a":"s/c70u6rAi8="},{"n":"최씨 가문의 꽃 한 송이","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"4 ~ 4인","m":"120분","d":"당신은 가문을 지킬 것인가, 진실을 택할 것인가? 지금 이 잔혹한 재벌가의 만찬 테이블로 당신을 초대합니다.","i":"3ad5026b-51f7-40dd-ac3b-9902382f3723.jpg","a":"AQAAAAAAAAE="},{"n":"화마","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"4 ~ 4인","m":"90분","d":"까맣게 불탄 시체. 검은 재속에 깊이 감춰진 단 하나의 서늘한 살의. 매케한 연기 속 누군가는 거짓말을 하고 있다.","i":"f17a43a2-0238-4f50-b39f-440d0c4af8f0.jpg","a":"gkgrwAApii4="},{"n":"뱀이 죽은 축제","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"4 ~ 4인","m":"120분","d":"전 국민이 아는 아역배우 출신 인기 연예인이 살해 당했다. 그곳에 있던 가면을 쓴 용의자들. 정체를 숨기고자 하는 이들 사이에서 진짜 범인을 찾아내야 한다.","i":"8ee8fbb1-7449-4e36-a3d2-c06263d19861.jpg","a":"AEAAAAAAAAA="},{"n":"천서","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"4 ~ 4인","m":"150분","d":"세상과 단절된 수도원 하나. 그곳은 사이비 종교 천석교의 본거지인 천서 수도원이다. 그곳에서 발견된 교주의 시체. 범인은 누구일까","i":"e997c221-f675-49da-a6b9-72d7b9eb088d.jpg","a":"AEAAAAAAAAA="},{"n":"기억저장장치","t":"머더미스터리","c":"머더미스터리","v":0,"l":"초급","p":"4 ~ 5인","m":"120분","d":"2033년 기억의 제약이 사라진 시대, 여섯 명의 대학생이 산속 별장으로 여행을 떠난다. 즐거운 저녁 식사 뒤, 하나둘 사라진 친구들을 시작으로 '최혁'은 누군가에게 살해당했고 '유은영'은 실종되며 평화롭던 여행은 비극으로 변했다. 남겨진 이들이 마주한 잔혹한 두 건의 사건. 과연 범인은...?","i":"caff1d4a-d926-4b56-8277-90a08b086817.png","a":"AEADAABJAAA="},{"n":"폭풍과 함께 마왕이 오셨도다","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"4 ~ 4인","m":"70분","d":"폭풍으로 고립된 밤의 학교를 무대로 범인 색출이 시작된다. 갑자기 교내 방송에서 들리는 고통스러운 목소리, 그리고 클래식 교향곡. 방송실에서는 \u003c마왕\u003e으로 불리우던 3학년 방송부 부장의 시체가 발견 되는데..","i":"ecfa83d4-05ef-4c46-9735-a30a0b1d921e.jpg","a":"hlwDkEQAACE="},{"n":"사라진 수영복과 하늘을 나는 물고기","t":"머더미스터리","c":"머더미스터리","v":1,"l":"초급","p":"5 ~ 5인","m":"60분","d":"쉐어하우스 '오션즈'의 주인인 하루는 어느 일요일 아침, 가장 좋아하던 수영복이 사라진 것을 꺠달았다. '오션즈'의 입주민 중 물건을 훔치는 사람이 있다면 큰 문제이니 수영복을 함께 찾기로 한다. 하지만 사건은 예상하지 못한 방향으로 흘러가는데…....?","i":"aea211bb-d377-43ad-86b2-2a15ebdd727c.jpg","a":"AAEDAAAAAAA="},{"n":"이세계의 성녀는 해방을 꿈꾼다","t":"머더미스터리","c":"머더미스터리","v":0,"l":"초급","p":"3 ~ 3인","m":"120분","d":"눈보라가 내리던 그해 가장 추운 겨울, 성인식을 위해 모인 그들은 열아홉과 함께... 성녀의 죽음을 맞이하게 된다. 폭설로 고립된 '시련의 탑'에서 모두가 마주하게 될 진실은?","i":"ad59283f-d16d-46dc-a09b-249154e86464.jpg","a":"AAADAAABAAA="},{"n":"주마등은 흰색으로 빛난다","t":"머더미스터리","c":"머더미스터리","v":0,"l":"초급","p":"3 ~ 3인","m":"120분","d":"새벽 눈이 한창 내린뒤, 별뉘 고등학교만의 특별한 졸업식이 시작된다. 학교 옥상에서 [임대서]가 떨어지는 순간... 시간이 멈추고 세상의 색이 사라졌다. 떨어지는 임대서를 목격한 세사람. 과연 범인은 누구인걸까?","i":"2b1c3a4b-4bc9-4fef-831c-8a9cde47ffcd.jpg","a":"ABALAAAIAAA="},{"n":"꼬리잡기 part,2","t":"머더미스터리","c":"머더미스터리","v":0,"l":"초급","p":"8 ~ 8인","m":"120분","d":"[꼬리잡기part.1]을 먼저 플레이 해주세요. 추리·스릴러물로 많은 사랑을 받은 네이버 웹툰 \u003c꼬리잡기\u003e가 8인용 머더 미스터리 2부작으로 출시! 긴장감 넘치는 전개 속에서 숨겨진 단서와 진실을 파헤쳐 보세요!","i":"6d79700c-264c-420f-9f28-fc8d84425bd1.jpg","a":"AEACAAAAACA="}]}</script>

<script>

  hero:{types:['보드게임','머더미스터리'],levels:['입문','초급','중급','고급','프로'],source:'히어로 보드게임카페 게임 목록',sourceUrl:'https://www.funhero.co.kr/store/segame.php?category_info_id=0&game_title=&region=&store_id=0',scope:'지역과 매장을 고르지 않은 전국 기준으로 모은 보드게임과 머더미스터리',availability:'게임 상세의 ‘보유매장 모두 보기’',updated:'2026-11-27'},
  redbutton:{types:['보드게임'],levels:['Very Easy','Easy','Normal','Semi-Hard','Hard','Extreme'],source:'레드버튼',sourceUrl:'https://redbutton.co.kr/',scope:'전국 기준으로 모은 레드버튼 보드게임',availability:'게임별 보유 매장',updated:'2026-11-27'}
};
const PAGE_SIZE=60;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const unique=a=>[...new Set(a.filter(Boolean))].sort((x,y)=>x.localeCompare(y,'ko'));
const parsePlayers=s=>{const n=(s.match(/\d+/g)||[]).map(Number);return n.length?{min:n[0],max:n[1]??n[0]}:null};
const parseMinutes=s=>{const m=s.match(/(\d+(?:\.\d+)?)\s*(시간|분)/);return m?Number(m[1])*(m[2]==='시간'?60:1):null};
const unpackStoreIndexes=value=>{if(Array.isArray(value))return value;if(typeof value!=='string'||!value)return[];const bin=atob(value),out=[];for(let i=0;i<bin.length;i++){const byte=bin.charCodeAt(i);for(let bit=0;bit<8;bit++)if(byte&(1<<bit))out.push(i*8+bit)}return out};
const addOptions=(sel,items)=>{for(const [value,text] of items){const o=document.createElement('option');o.value=value;o.textContent=text;sel.append(o)}};
const imgObserver='IntersectionObserver'in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const img=e.target;img.src=img.dataset.src;img.removeAttribute('data-src');imgObserver.unobserve(img)}}),{rootMargin:'180px'}):null;

function createBrand(key,panel){
  const cfg=BRANDS[key],data=JSON.parse(document.getElementById('data-'+key).textContent);
  panel.append(document.getElementById('panelTpl').content.cloneNode(true));
  const f={};panel.querySelectorAll('[data-f]').forEach(el=>{f[el.dataset.f]=el;el.id=key+'-'+el.dataset.f});
  panel.querySelectorAll('label[data-for]').forEach(l=>l.htmlFor=key+'-'+l.dataset.for);
  const {regions,stores}=data,cats=new Set();
  const model=data.games.map((g,index)=>{const type=g.t||cfg.types[0],c=(g.c||'').split(',').map(x=>x.trim()).filter(Boolean),a=unpackStoreIndexes(g.a);
    return{...g,index,type,cats:c,storeSet:new Set(a),regionSet:new Set(a.map(s=>stores[s][0])),players:parsePlayers(g.p||''),minutes:parseMinutes(g.m||''),
      search:[g.n,g.e,g.d,g.c,type,g.l,g.p,g.m].join(' ').toLocaleLowerCase('ko')}});
  // 필터 옵션
  addOptions(f.type,(cfg.types.length>1?[['','전체 종류']]:[]).concat(cfg.types.map(t=>[t,t])));f.type.disabled=cfg.types.length<2;
  addOptions(f.region,unique(regions).map(r=>[regions.indexOf(r),r]));
  const categoryOptions=unique(model.flatMap(g=>g.cats));
  f.category.setAttribute('aria-controls',f.categoryOptions.id);
  let activeCategoryIndex=-1,categoryMatches=[];
  function closeCategoryOptions(){f.categoryOptions.hidden=true;f.category.setAttribute('aria-expanded','false');f.category.removeAttribute('aria-activedescendant');activeCategoryIndex=-1}
  function markCategoryOption(index){activeCategoryIndex=index;const options=[...f.categoryOptions.querySelectorAll('[role="option"]')];
    options.forEach((option,i)=>option.setAttribute('aria-selected',String(i===index)));
    const active=options[index];if(active){f.category.setAttribute('aria-activedescendant',active.id);active.scrollIntoView({block:'nearest'})}else f.category.removeAttribute('aria-activedescendant')}
  function renderCategoryOptions(){const query=f.category.value.trim().toLocaleLowerCase('ko');f.categoryOptions.replaceChildren();f.categoryStatus.classList.remove('error');
    f.category.removeAttribute('aria-invalid');activeCategoryIndex=-1;
    categoryMatches=categoryOptions.filter(value=>!query||value.toLocaleLowerCase('ko').includes(query));
    if(!categoryMatches.length){closeCategoryOptions();f.categoryStatus.textContent=query?'일치하는 분류가 없습니다.':'등록된 분류가 없습니다.';return}
    const visibleMatches=query?categoryMatches.slice(0,50):categoryMatches;
    visibleMatches.forEach((value,index)=>{const option=document.createElement('div');option.className='combo-option'+(cats.has(value)?' is-added':'');option.id=f.categoryOptions.id+'-option-'+index;option.dataset.value=value;option.setAttribute('role','option');option.setAttribute('aria-selected','false');option.setAttribute('aria-disabled',String(cats.has(value)));option.textContent=value+(cats.has(value)?' · 추가됨':'');
      option.addEventListener('mousedown',event=>event.preventDefault());option.addEventListener('click',()=>{if(cats.has(value)){f.categoryStatus.classList.add('error');f.categoryStatus.textContent='이미 추가된 분류입니다.'}else selectCategory(value)});f.categoryOptions.append(option)});
    f.categoryOptions.hidden=false;f.category.setAttribute('aria-expanded','true');f.categoryStatus.textContent=query&&categoryMatches.length>50?'앞의 50개 결과를 표시합니다. 더 구체적으로 검색해 주세요.':''}
  function rejectCategoryInput(){f.category.classList.remove('combo-invalid');void f.category.offsetWidth;f.category.classList.add('combo-invalid');f.category.setAttribute('aria-invalid','true');f.categoryStatus.classList.add('error');f.categoryStatus.textContent='목록에서 분류를 선택해 주세요.';setTimeout(()=>{f.category.classList.remove('combo-invalid');f.category.removeAttribute('aria-invalid')},350)}
  function selectCategory(value){if(!categoryOptions.includes(value)||cats.has(value)){rejectCategoryInput();return}cats.add(value);f.category.value='';closeCategoryOptions();f.categoryStatus.textContent='';f.categoryStatus.classList.remove('error');renderChips();update();f.category.focus()}
  const rank=d=>{const i=cfg.levels.indexOf(d);return i<0?Infinity:i};
  addOptions(f.difficulty,unique(model.map(g=>g.l)).sort((a,b)=>rank(a)-rank(b)).map(d=>[d,d]));
  function fillStores(){const r=f.region.value;f.store.innerHTML='';f.store.disabled=!r;
    addOptions(f.store,[['',r?'지역 내 전체 매장':'지역 먼저 선택']]);if(!r)return;
    addOptions(f.store,stores.map((s,i)=>[i,s]).filter(([,s])=>s[0]===+r).map(([i,s])=>[i,s[1]]).sort((x,y)=>x[1].localeCompare(y[1],'ko')))}
  fillStores();
  f.footnote.innerHTML=esc(cfg.scope)+' 목록입니다. 지역과 매장 필터는 '+esc(cfg.availability)+' 정보로 만들었습니다. 데이터 출처: <a class="site-link" href="'+esc(cfg.sourceUrl)+'" target="_blank" rel="noopener">'+esc(cfg.source)+'</a>. 게임 이미지는 화면에 보일 때 원본 서버에서 불러옵니다.';
  // 카드·페이지
  const card=g=>{const img=g.i?data.imgBase+g.i:'';
    return '<article class="card"><div class="card-head"><div class="thumb">'+(img?'<img data-src="'+esc(img)+'" alt="'+esc(g.n)+' 게임 이미지" loading="lazy" decoding="async" referrerpolicy="no-referrer"><span class="placeholder" hidden>이미지 없음</span>':'<span class="placeholder">이미지 없음</span>')+'</div><div class="title-side"><h2>'+esc(g.n)+'</h2><div class="badges"><span class="badge type">'+esc(g.type)+'</span>'+g.cats.map(x=>'<span class="badge">'+esc(x)+'</span>').join('')+'<span class="badge '+(g.v?'video':'no-video')+'">영상 '+(g.v?'보유':'미보유')+'</span></div></div><div class="search-links"><a class="search-link google-link" href="https://www.google.com/search?q='+encodeURIComponent('보드게임 '+g.n)+'" target="_blank" rel="noopener" title="구글에서 검색" aria-label="구글에서 '+esc(g.n)+' 검색"><svg aria-hidden="true"><use href="#google-icon"/></svg></a><a class="search-link naver-link" href="https://search.naver.com/search.naver?query='+encodeURIComponent('보드게임 '+g.n)+'" target="_blank" rel="noopener" title="네이버에서 검색" aria-label="네이버에서 '+esc(g.n)+' 검색"><svg aria-hidden="true"><use href="#naver-icon"/></svg></a></div></div><div class="meta"><span>난이도 <b>'+esc(g.l||'미기재')+'</b></span><span>인원 <b>'+esc(g.p||'미기재')+'</b></span><span>시간 <b>'+esc(g.m||'미기재')+'</b></span></div><p class="desc">'+esc(g.d||'설명 미기재')+'</p></article>'};
  f.results.addEventListener('error',e=>{const img=e.target;if(img.tagName==='IMG'){img.hidden=true;if(img.nextElementSibling)img.nextElementSibling.hidden=false}},true);
  let filtered=[],rendered=0,moreObserver=null;

  function more(){clearMore();const tpl=document.createElement('template');tpl.innerHTML=filtered.slice(rendered,rendered+PAGE_SIZE).map(card).join('');
    tpl.content.querySelectorAll('img[data-src]').forEach(img=>{if(imgObserver)imgObserver.observe(img);else{img.src=img.dataset.src;img.removeAttribute('data-src')}});
    f.results.append(tpl.content);rendered=Math.min(rendered+PAGE_SIZE,filtered.length);
    const hasMore=rendered<filtered.length;f.displayed.textContent='('+rendered.toLocaleString('ko-KR')+(hasMore?'개 표시 중)':'개 표시)');
    if(!hasMore)return;const s=document.createElement('div');s.className='more-wrap scroll-sentinel';s.setAttribute('aria-hidden','true');f.results.append(s);
    if('IntersectionObserver'in window){moreObserver=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting))more()},{rootMargin:'500px 0px'});moreObserver.observe(s)}
    else{s.className='more-wrap';s.removeAttribute('aria-hidden');s.innerHTML='<button class="button primary" type="button">더 보기</button>';s.querySelector('button').addEventListener('click',more)}}
  // 필터링
  function update(){clearMore();
    const q=f.q.value.trim().toLocaleLowerCase('ko'),t=f.type.value,sel=[...cats],d=f.difficulty.value,v=f.video.value,
      pn=Number(f.players.value)||null,mx=Number(f.minutes.value)||null,r=f.region.value===''?null:+f.region.value,s=f.store.value===''?null:+f.store.value;
    filtered=model.filter(g=>(!q||g.search.includes(q))&&(!t||g.type===t)&&sel.every(c=>g.cats.includes(c))&&(!d||g.l===d)&&(!v||(v==='yes')===!!g.v)
      &&(!pn||(g.players&&g.players.min<=pn&&g.players.max>=pn))&&(!mx||(g.minutes!==null&&g.minutes<=mx))&&(r===null||g.regionSet.has(r))&&(s===null||g.storeSet.has(s)));
    const sort=f.sort.value;
    if(sort==='name')filtered.sort((a,b)=>a.n.localeCompare(b.n,'ko')||a.index-b.index);
    if(sort==='short')filtered.sort((a,b)=>(a.minutes??Infinity)-(b.minutes??Infinity)||a.index-b.index);
    if(sort==='long')filtered.sort((a,b)=>(b.minutes??-1)-(a.minutes??-1)||a.index-b.index);
    f.shown.textContent=filtered.length.toLocaleString('ko-KR');rendered=0;f.results.innerHTML='';
    if(!filtered.length){f.displayed.textContent='';f.results.innerHTML='<div class="empty"><strong>조건에 맞는 게임이 없습니다</strong>검색어나 필터를 바꿔 다시 찾아보세요.</div>';return}
    more()}
  function renderChips(){f.chips.innerHTML='';for(const value of cats){const chip=document.createElement('span');chip.className='chip';const label=document.createElement('span');label.textContent=value;
    const x=document.createElement('button');x.type='button';x.setAttribute('aria-label','분류 '+value+' 제거');x.textContent='×';
    x.addEventListener('click',()=>{cats.delete(value);renderChips();update()});chip.append(label,x);f.chips.append(chip)}}
  let timer;['q','players','minutes'].forEach(k=>f[k].addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(update,120)}));
  ['type','difficulty','video','sort','store'].forEach(k=>f[k].addEventListener('change',update));
  f.region.addEventListener('change',()=>{fillStores();update()});
  f.category.addEventListener('input',renderCategoryOptions);
  f.category.addEventListener('focus',renderCategoryOptions);
  f.category.addEventListener('blur',()=>{closeCategoryOptions();if(!f.categoryStatus.classList.contains('error')&&!f.category.value)f.categoryStatus.textContent=''});
  f.category.addEventListener('keydown',event=>{const count=f.categoryOptions.querySelectorAll('[role="option"]').length;
    if(event.key==='ArrowDown'&&count){event.preventDefault();markCategoryOption(Math.min(activeCategoryIndex+1,count-1))}
    else if(event.key==='ArrowUp'&&count){event.preventDefault();markCategoryOption(Math.max(activeCategoryIndex-1,0))}
    else if(event.key==='Escape'){closeCategoryOptions()}
    else if(event.key==='Enter'){event.preventDefault();const options=[...f.categoryOptions.querySelectorAll('[role="option"]')],active=options[activeCategoryIndex],exact=categoryMatches.find(value=>value.toLocaleLowerCase('ko')===f.category.value.trim().toLocaleLowerCase('ko'));
      if(active)selectCategory(active.dataset.value);else if(exact)selectCategory(exact);else if(f.category.value.trim())rejectCategoryInput()}});
  panel.querySelector('form').addEventListener('submit',e=>e.preventDefault());
  f.reset.addEventListener('click',()=>{cats.clear();renderChips();['q','players','minutes'].forEach(k=>f[k].value='');
    ['category','difficulty','video','sort','region'].forEach(k=>f[k].value='');closeCategoryOptions();f.categoryStatus.textContent='';f.categoryStatus.classList.remove('error');f.category.removeAttribute('aria-invalid');if(!f.type.disabled)f.type.value='';fillStores();update()});
  update();
}
const created=new Set();
function showBrand(key){document.querySelectorAll('.brand-tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.brand===key)));
  document.querySelectorAll('[data-panel]').forEach(p=>{p.hidden=p.dataset.panel!==key;if(!p.hidden&&!created.has(key)){created.add(key);createBrand(key,p)}});document.querySelector('.last-updated').textContent='업데이트 '+BRANDS[key].updated}
document.querySelectorAll('.brand-tab').forEach(btn=>btn.addEventListener('click',()=>showBrand(btn.dataset.brand)));
showBrand('hero');
const toTop=document.querySelector('.to-top');addEventListener('scroll',()=>toTop.classList.toggle('show',scrollY>800),{passive:true});toTop.addEventListener('click',()=>{const y0=scrollY,t0=performance.now(),d=300;if(matchMedia('(prefers-reduced-motion: reduce)').matches)return scrollTo(0,0);const step=t=>{const k=Math.min(1,(t-t0)/d);scrollTo(0,y0*Math.pow(1-k,3));if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)});
</script></body></html>
