const addOptions=(sel,items)=>{for(const [value,text] of items){const o=document.createElement('option');o.value=value;o.textContent=text;sel.append(o)}};
function createBrand(key,panel,data){

  function rejectCategoryInput(){f.category.classList.remove('combo-invalid');void f.category.offsetWidth;f.category.classList.add('combo-invalid');f.category.setAttribute('aria-invalid','true');f.categoryStatus.classList.add('error');f.categoryStatus.textContent='목록에서 분류를 선택해 주세요.';setTimeout(()=>{f.category.classList.remove('combo-invalid');f.category.removeAttribute('aria-invalid')},350)}

  function getFilters(){

  f.footnote.innerHTML=esc(cfg.scope)+' 목록입니다. 지역과 매장 필터는 '+esc(cfg.availability)+' 정보로 만들었습니다. 데이터 출처: <a class="site-link" href="'+esc(cfg.sourceUrl)+'" target="_blank" rel="noopener">'+esc(cfg.source)+'</a>.';
  function card(g){

      ?cardLink(g.videoUrl,'play-icon',g.n+' 설명 영상','설명 영상')
      :cardLink('https://www.youtube.com/results?search_query='+encodeURIComponent(search+' 룰 설명'),'youtube-icon','유튜브에서 '+g.n+' 설명 영상 검색','검색');
    const google=cardLink('https://www.google.com/search?q='+query,'google-icon','구글에서 '+g.n+' 검색');
    const naver=cardLink('https://search.naver.com/search.naver?query='+query,'naver-icon','네이버에서 '+g.n+' 검색');
    const thumb=img?'<img src="'+esc(img)+'" alt="'+esc(g.n)+' 게임 이미지" loading="lazy" decoding="async" referrerpolicy="no-referrer"><span class="placeholder" hidden>이미지 없음</span>':'<span class="placeholder">이미지 없음</span>';

    return '<article class="card"><div class="card-head"><div class="thumb">'+thumb+'</div><div class="title-side"><h2>'+esc(g.n)+'</h2><div class="badges">'+categories+'</div></div></div>'
      +'<div class="meta"><span>난이도 <b>'+esc(g.l||'미기재')+'</b></span><span>인원 <b>'+esc(g.p||'미기재')+'</b></span><span>시간 <b>'+esc(g.m||'미기재')+'</b></span></div>'
      +'<p class="desc">'+esc(g.d||'설명 미기재')+'</p>'
      +'<footer class="card-actions">'+video+'<div class="card-searches">'+google+naver+'</div></footer></article>';
  }
  f.results.addEventListener('error',e=>{const img=e.target;if(img.tagName==='IMG'){img.hidden=true;if(img.nextElementSibling)img.nextElementSibling.hidden=false}},true);
  let filtered=[],rendered=0,moreObserver=null;
  const clearMore=()=>{if(moreObserver){moreObserver.disconnect();moreObserver=null}const old=f.results.querySelector('.more-wrap');if(old)old.remove()};
  function more(){clearMore();const tpl=document.createElement('template');tpl.innerHTML=filtered.slice(rendered,rendered+PAGE_SIZE).map(card).join('');
    f.results.append(tpl.content);rendered=Math.min(rendered+PAGE_SIZE,filtered.length);
    const hasMore=rendered<filtered.length;f.displayed.textContent='('+rendered.toLocaleString('ko-KR')+(hasMore?'개 표시 중)':'개 표시)');
    if(!hasMore)return;const s=document.createElement('div');s.className='more-wrap scroll-sentinel';s.setAttribute('aria-hidden','true');f.results.append(s);
    if('IntersectionObserver'in window){moreObserver=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting))more()},{rootMargin:'500px 0px'});moreObserver.observe(s)}
    else{s.className='more-wrap';s.removeAttribute('aria-hidden');s.innerHTML='<button class="button primary" type="button">더 보기</button>';s.querySelector('button').addEventListener('click',more)}}
  // 필터링
  const shareLabel=f.share.textContent;
  let inputTimer,shareTimer,copyAttempt=0;
  function resetShareFeedback(){

  }
  function update(){clearTimeout(inputTimer);clearMore();
    copyAttempt++;
    resetShareFeedback();
    saveSearchAddress(key,getFilters());
    const q=f.q.value.trim().toLocaleLowerCase('ko'),sel=[...cats],d=f.difficulty.value,
      pn=filterNumber(f.players),mx=filterNumber(f.minutes),r=f.region.value===''?null:+f.region.value,s=f.store.value===''?null:+f.store.value;
    filtered=model.filter(g=>(!q||g.search.includes(q))&&sel.every(c=>g.cats.includes(c))&&(!d||g.l===d)

    const sort=f.sort.value;

    if(sort==='short')filtered.sort((a,b)=>(a.minutes??Infinity)-(b.minutes??Infinity)||a.index-b.index);

    more()}
  function renderChips(){f.chips.innerHTML='';for(const value of cats){const chip=document.createElement('span');chip.className='chip';const label=document.createElement('span');label.textContent=value;
    const x=document.createElement('button');x.type='button';x.setAttribute('aria-label','분류 '+value+' 제거');x.textContent='×';
    x.addEventListener('click',()=>{cats.delete(value);renderChips();update()});chip.append(label,x);f.chips.append(chip)}}
  textFields.forEach(k=>f[k].addEventListener('input',()=>{clearTimeout(inputTimer);inputTimer=setTimeout(update,120)}));

  f.category.addEventListener('input',renderCategoryOptions);

const tabs=[...document.querySelectorAll('.brand-tab')];
const panels=new Map([...document.querySelectorAll('[data-panel]')].map(panel=>[panel.dataset.panel,panel]));
const lastUpdated=document.querySelector('.last-updated');
const defaultBrand=tabs[0].dataset.brand;
const views=new Map(),pending=new Map(),requestedFilters=new Map();
let activeBrand;
function searchFragment(key,filters){
  if(key===defaultBrand&&!filters.toString())return '';
  const fragment=new URLSearchParams({brand:key});
  for(const [name,value] of filters)fragment.append(name,value);
  return fragment.toString();
}
function saveSearchAddress(key,filters){
  if(activeBrand!==key)return;
  const url=new URL(location.href);
  url.hash=searchFragment(key,filters);
  if(url.href!==location.href)history.replaceState(null,'',url.href);
}
window.receiveBoardgameCatalog=(key,data)=>{
  const load=pending.get(key);
  if(!load)return;
  try{
    if(!data?.games?.length||!Array.isArray(data.stores)||!Array.isArray(data.regions)||!/^\d{4}-\d{2}-\d{2}$/.test(data.updated))throw new Error('Invalid catalog '+key);
    load.panel.replaceChildren();
    const view=createBrand(key,load.panel,data);
    view.restoreFilters(requestedFilters.get(key)||new URLSearchParams());
    requestedFilters.delete(key);
    views.set(key,view);
    if(activeBrand===key)lastUpdated.textContent='업데이트 '+data.updated;
    load.completed=true;
  }catch(error){console.error(error)}
};
function loadBrand(key){
  const panel=panels.get(key);
  let script;
  const status=document.createElement('p');status.className='empty';status.setAttribute('role','status');
  status.textContent='게임 목록을 불러오는 중입니다.';panel.replaceChildren(status);
  const load={panel,completed:false};pending.set(key,load);
  function finish(){
    script?.remove();pending.delete(key);
    if(load.completed)return;
    status.textContent='게임 목록을 불러오지 못했습니다. ';
    const retry=document.createElement('button');retry.type='button';retry.className='button';retry.textContent='다시 시도';
    retry.addEventListener('click',()=>loadBrand(key));status.append(retry);panel.replaceChildren(status);
  }
  const embedded=document.getElementById('catalog-'+key);
  if(embedded){
    try{window.receiveBoardgameCatalog(key,JSON.parse(embedded.textContent));}catch(error){console.error(error);}
    if(load.completed)embedded.remove();
    finish();
    return;
  }
  script=document.createElement('script');
  script.onload=finish;script.onerror=finish;
  script.src='./assets/catalogs/'+key+'.js';document.head.append(script);
}
function showBrand(key,filters){
  activeBrand=key;
  for(const tab of tabs)tab.setAttribute('aria-selected',String(tab.dataset.brand===key));
  for(const [brand,panel] of panels)panel.hidden=brand!==key;
  const view=views.get(key);
  lastUpdated.textContent=view?'업데이트 '+view.updated:'';
  if(view){
    if(filters)view.restoreFilters(filters);
    else saveSearchAddress(key,view.getFilters());
    return;
  }
  if(filters)requestedFilters.set(key,filters);
  else saveSearchAddress(key,requestedFilters.get(key)||new URLSearchParams());
  if(!pending.has(key))loadBrand(key);
}
function restoreAddress(){
  const filters=new URLSearchParams(location.hash.slice(1)),brand=filters.get('brand');
  showBrand(panels.has(brand)?brand:defaultBrand,filters);
}
for(const tab of tabs)tab.addEventListener('click',()=>showBrand(tab.dataset.brand));
addEventListener('hashchange',restoreAddress);
restoreAddress();
const toTop=document.querySelector('.to-top');addEventListener('scroll',()=>toTop.classList.toggle('show',scrollY>800),{passive:true});toTop.addEventListener('click',()=>{const y0=scrollY,t0=performance.now(),d=300;if(matchMedia('(prefers-reduced-motion: reduce)').matches)return scrollTo(0,0);const step=t=>{const k=Math.min(1,(t-t0)/d);scrollTo(0,y0*Math.pow(1-k,3));if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)});
</script></body></html>
